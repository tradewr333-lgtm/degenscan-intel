services:
  - type: web
    name: degenscan-intel
    runtime: docker
    plan: starter
    region: ohio
    healthCheckPath: /health
    disk:
      name: intel-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: INTEL_UA
        value: "Degenscan Intel/0.1 (+https://degenscan.io; contact@degenscan.io)"
      - key: DB_PATH
        value: /data/intel.db
      - key: UNIVERSE_PATH
        value: /data/universe.json
      - key: INTEL_FREE
        value: "0"
      - key: X402_NETWORK
        value: base
      - key: X402_FACILITATOR_URL
        value: https://facilitator.payai.network
      - key: FREE_DAILY_CALLS
        value: "100"
      - key: PUBLIC_URL
        value: https://degenscan-intel.onrender.com
      - key: X402_PAY_TO
        sync: false
      - key: X402_PAY_TO_SOLANA
        sync: false
      - key: API_KEYS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
