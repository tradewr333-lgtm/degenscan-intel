[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "degenscan-intel"
version = "0.2.0"
description = "Cross-asset market-event intelligence for AI trading agents (SEC, Fed, regulators, disasters, halts, hacks, Polymarket, Hyperliquid perps). Pays per call in USDC via x402 or uses an API key."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Marbella Collins LLC", email = "contact@degenscan.io" }]
requires-python = ">=3.10"
keywords = ["x402", "ai-agents", "trading-bot", "market-data", "sec-edgar", "federal-reserve", "hyperliquid", "funding-rate", "polymarket", "mcp", "usdc", "base", "market-events", "langchain", "agentkit"]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Office/Business :: Financial", "Intended Audience :: Developers"]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
x402 = ["x402>=2.24", "eth-account>=0.13"]

[project.urls]
Homepage = "https://intel.degenscan.io"
Documentation = "https://intel.degenscan.io/llms.txt"
Repository = "https://github.com/tradewr333-lgtm/degenscan-intel"

[tool.hatch.build.targets.wheel]
packages = ["degenscan_intel"]
